<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="\static\style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
        </header>

        <div class="main-content">
            <!-- LEFT: Add Transaction Form -->
            <div class="form-section">
                <h2>Add Transaction</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" required>
                            <option value="">Select Type</option>
                            <option value="salary">Salary</option>
                            <option value="profit">Profit</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="e.g., Groceries" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price (PKR):</label>
                        <input type="number" id="price" placeholder="0.00" step="1" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="text" id="date" placeholder="YYYY-MM-DD or 'today'" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Time:</label>
                        <input type="text" id="time" placeholder="HH:MM" required>
                    </div>

                    <button type="submit" class="btn-add">Add Transaction</button>
                </form>
            </div>

            <!-- RIGHT: Summary Box -->
            <div class="summary-section">
                <h2>Summary</h2>
                <div class="summary-content">
                    <div class="summary-item">
                        <span>Total Salary:</span>
                        <strong id="totalSalary">0 PKR</strong>
                    </div>
                    <div class="summary-item">
                        <span>Total Profit:</span>
                        <strong id="totalProfit">0 PKR</strong>
                    </div>
                    <div class="summary-item">
                        <span>Total Income:</span>
                        <strong id="totalIncome">0 PKR</strong>
                    </div>
                    <div class="summary-item">
                        <span>Total Expenses:</span>
                        <strong id="totalExpenses">0 PKR</strong>
                    </div>
                    <div class="summary-item highlight">
                        <span>Net Balance:</span>
                        <strong id="netBalance">0 PKR</strong>
                    </div>
                    <div class="summary-item">
                        <span>Average Transaction:</span>
                        <strong id="avgTransaction">0 PKR</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM: Transactions List -->
        <div class="transactions-section">
            <h2>Transactions</h2>
            <div id="transactionsList" class="transactions-list">
                <!-- Transactions will be added here by JavaScript -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
